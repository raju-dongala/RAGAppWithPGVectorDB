spring.application.name=SpringRAGApp

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=granite4:3b
spring.ai.ollama.embedding.options.model=nomic-embed-text:latest


spring.datasource.url=jdbc:postgresql://localhost:5432/springai
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB